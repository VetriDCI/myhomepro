services:
  - type: web
    name: super-ai-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Only needed if you enable the 5-minute video generator.
      # Leave blank to use chat-only mode.
      - key: VIDEO_GENERATION_URL
        sync: false
      - key: VIDEO_STATUS_URL
        sync: false
      - key: VIDEO_API_KEY
        sync: false
