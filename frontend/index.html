<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23151515'/%3E%3Cpath d='M50 18 L61 42 L86 46 L67 63 L72 88 L50 75 L28 88 L33 63 L14 46 L39 42 Z' fill='%237c5cff'/%3E%3C/svg%3E">
<title>SUPER AI STUDIO</title>
<style>
:root{--bg:#151515;--panel:#111419;--panel2:#181c22;--line:#2a3038;--text:#e5e5e5;--muted:#9aa3ad;--accent:#7c5cff;--accent2:#00c2ff;--danger:#ff5b63;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:padding-box}*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
button,select,textarea,input{font:inherit}.app{display:flex;height:100vh}
.sidebar{width:265px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;flex:none}
.brand{padding:12px 10px 18px;font-weight:800;letter-spacing:.4px;font-size:18px}.brand span{color:#9d8cff}
.newchat{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);text-align:left;padding:0 12px;cursor:pointer;transition:background .15s}.newchat:hover,.chatrow:hover{background:#333c48;color:#fff}
.side-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:20px 10px 7px}.history{overflow:auto}.chatrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;color:var(--text);font-size:13px;cursor:pointer}.chatrow .dot{width:6px;height:6px;border-radius:50%;background:#5c6672;flex:none}.chatrow.active .dot{background:#8d78ff}.chatrow .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chatrow .del{flex:none;width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center}.chatrow:hover .del{display:flex}.chatrow .del:hover{background:var(--danger);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;background:var(--panel)}.modelname{font-size:14px;font-weight:750;color:var(--text)}.modelname small{color:var(--muted);font-weight:450;margin-left:5px}.top-actions{position:absolute;right:12px;display:flex;gap:7px}.top-actions button{width:35px;height:35px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;cursor:pointer}
.chat{flex:1;overflow:auto;padding:25px 18px 175px}.messages{max-width:880px;margin:auto}.empty{min-height:65vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.empty h1{font-size:30px;margin:0 0 8px}.empty p{color:var(--muted);margin:0}.empty .quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.quick button{border:1px solid var(--line);background:#14181d;color:#dce1e6;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:12px}
.msg{display:flex;gap:11px;margin:24px 0}.msg.user{flex-direction:row-reverse;text-align:right}.avatar{width:31px;height:31px;flex:none;border-radius:8px;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px}.user .avatar{background:var(--accent);color:#fff}.bubble{max-width:800px;line-height:1.58;font-size:14px;min-width:0;color:var(--text)}.user .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-left:auto}.meta{color:var(--muted);font-size:10px;margin-top:7px}.typing{display:flex;gap:4px;align-items:center}.typing i{width:6px;height:6px;border-radius:50%;background:#9da6b1;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2}}
.attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.att{width:155px;background:#101419;border:1px solid var(--line);border-radius:9px;overflow:hidden}.att img,.att video{width:100%;height:95px;object-fit:cover;display:block}.attname{padding:6px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer-wrap{position:fixed;left:265px;right:0;bottom:0;padding:28px 18px 17px;background:linear-gradient(transparent,var(--bg) 28%);z-index:5}.composer{max-width:880px;margin:auto;border:1px solid #343a43;background:#171b20;border-radius:16px;box-shadow:0 14px 45px #000a;position:relative}.prompt{width:100%;min-height:62px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:14px 14px 4px}.composerbar{display:flex;align-items:center;gap:7px;padding:8px 9px}.plus{width:38px;height:38px;border:1px solid #3b4149;background:#20252b;color:#fff;border-radius:10px;font-size:24px;line-height:1;cursor:pointer}.plus:hover{background:#2a3038}.send{margin-left:auto;width:38px;height:38px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}.send:disabled{opacity:.3}.send.stop{background:var(--danger);color:#fff}.mode{border:1px solid var(--line);background:#12161a;color:#bfc6cd;border-radius:999px;padding:6px 9px;font-size:11px;cursor:pointer}.mode.active{background:#2a2147;border-color:#6650bf;color:#fff}.mode[data-mode=studio].active{background:#1f2440;border-color:#596fe0}.mode[data-mode=math].active{background:#243b2b;border-color:#4f9d68}.mode[data-mode=code].active{background:#3b2d1d;border-color:#b67b38}.mode-note{font-size:10px;color:var(--muted);margin-left:2px;white-space:nowrap}.modebar{display:flex;gap:6px;align-items:center;overflow:auto}.previewbar{display:none;border-top:1px solid var(--line);padding:8px;gap:8px;overflow:auto}.previewbar.show{display:flex}.preview{position:relative;flex:none;width:78px;height:58px;background:#0d1014;border:1px solid var(--line);border-radius:8px;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.preview .x{position:absolute;right:3px;top:3px;width:19px;height:19px;border:0;border-radius:50%;background:#000b;color:#fff;cursor:pointer}.dropzone{position:absolute;inset:0;background:#171b20eF;display:none;align-items:center;justify-content:center;z-index:10;border-radius:16px;border:2px dashed #705be0;color:#fff}.dropzone.show{display:flex}
.hint{text-align:center;color:#69727d;font-size:10px;margin-top:7px}.menu{position:absolute;left:9px;bottom:55px;width:255px;background:#171b20;border:1px solid #363c45;border-radius:12px;box-shadow:0 16px 45px #000c;padding:6px;display:none;z-index:30}.menu.show{display:block}.menu button{width:100%;border:0;background:transparent;color:#edf0f3;text-align:left;padding:11px;border-radius:8px;cursor:pointer;font-size:13px}.menu button:hover{background:#242a31}.menu small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.file{display:none}
.download-menu{position:absolute;right:0;top:34px;width:190px;background:#171b20;border:1px solid #363c45;border-radius:10px;box-shadow:0 16px 45px #000c;padding:5px;display:none;z-index:40}.download-menu.show{display:block}.download-menu button{width:100%;border:0;background:transparent;color:#edf0f3;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:12px}.download-menu button:hover{background:#242a31}.message-actions{display:flex;gap:6px;justify-content:flex-start;margin-top:8px;position:relative}.message-actions .download{border:1px solid var(--line);background:#14181d;color:#cfd5dc;border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer}.message-actions .download:hover{background:#222831;color:#fff}.file-chip{display:flex;align-items:center;gap:7px;width:170px;height:58px;padding:7px 9px;background:#101419;border:1px solid var(--line);border-radius:8px;color:#dfe4e9}.file-chip .fi{font-size:20px;flex:none}.file-chip .fn{min-width:0;overflow:hidden}.file-chip .fn b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-chip .fn small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.folder-note{font-size:10px;color:var(--muted);padding:4px 2px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50}.modal.show{display:flex}.settings{width:min(650px,92vw);max-height:85vh;overflow:auto;background:#15191e;border:1px solid #363c44;border-radius:16px;box-shadow:0 25px 80px #000; padding:18px}.settings h2{margin:0 0 14px;font-size:18px;color:#fff}.setting{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.setting label{font-size:12px;color:#c9cfd6}.setting input,.setting select{width:100%;background:#0f1317;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;outline:0}.switch{display:flex;align-items:center;gap:8px}.settings-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:14px}.settings-actions button{border:1px solid var(--line);background:#20252b;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.settings-actions .save{background:var(--accent);border-color:var(--accent)}
.toast{position:fixed;right:18px;top:72px;background:#171b20;color:#fff;border:1px solid #363c44;padding:10px 13px;border-radius:9px;display:none;z-index:80;font-size:12px}.toast.show{display:block}
@media(max-width:820px){.sidebar{display:none}.composer-wrap{left:0}.chat{padding-left:10px;padding-right:10px}.modebar{max-width:calc(100vw - 100px)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">✦ SUPER <span>AI STUDIO</span></div>
  <button class="newchat" onclick="newChat()">＋ New chat</button>
  <div class="side-label">Recent chats</div>
  <div class="history" id="history"></div>
</aside>

<main class="main">
<header class="topbar">
  <div class="modelname">SUPER AI STUDIO <small id="modelLabel">AI</small></div>
  <div class="top-actions">
    <button onclick="toggleTheme()" title="Theme">◐</button>
    <button onclick="openSettings()" title="Settings">⚙</button>
  </div>
</header>

<section class="chat" id="chat">
  <div class="messages" id="messages">
    <div class="empty" id="empty">
      <h1>Ready when you are.</h1>
    </div>
  </div>
</section>

<div class="composer-wrap">
  <div class="composer" id="composer">
    <div class="dropzone" id="dropzone">Drop files here</div>
    <div class="menu" id="plusMenu">
      <button onclick="choose('all')">📎 Add files<small>Images, video, audio, PDF, Word, ZIP and more</small></button>
      <button onclick="choose('folder')">📁 Add folder<small>Select a complete project/document folder</small></button>
      <button onclick="clearFiles()">🗑️ Remove all attachments</button>
    </div>
    <textarea class="prompt" id="prompt" placeholder="Ask anything" oninput="resizePrompt(this);toggleSend()" onkeydown="handleKey(event)"></textarea>
    <div class="previewbar" id="previewbar"></div>
    <div class="composerbar">
      <button class="plus" onclick="toggleMenu()" title="Add image or video">+</button>
      <button class="send" id="send" disabled onclick="handleSendClick()">↑</button>
    </div>
  </div>
  <div class="hint">Enter to send • Shift+Enter for new line • Drop files into the box</div>
</div>
</main>
</div>

<input class="file" id="allInput" type="file" accept="*/*" multiple>
<input class="file" id="folderInput" type="file" webkitdirectory directory multiple>

<div class="modal" id="settingsModal" onclick="if(event.target===this)closeSettings()">
<div class="settings">
<h2>⚙ Settings</h2>
<div class="setting"><label>Backend URL</label><input id="sBackend" placeholder="http://localhost:3000"></div>
<div class="setting"><label>AI model label</label><input id="sModel" placeholder="AI"></div>
<div class="setting"><label>Default mode</label><select id="sMode"><option value="chat">Chat</option><option value="studio">Studio</option><option value="math">Math</option></select></div>
<div class="setting"><label>Theme</label><select id="sTheme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
<div class="setting"><label>Send on Enter</label><div class="switch"><input type="checkbox" id="sEnter"> Enable</div></div>
<div class="setting"><label>Auto save chats</label><div class="switch"><input type="checkbox" id="sSave"> Enable</div></div>
<div class="setting"><label>Voice input</label><div class="switch"><input type="checkbox" id="sVoice"> Show microphone button</div></div>
<div class="setting"><label>Chat history</label><button onclick="clearHistory()" style="border:1px solid var(--line);background:#20252b;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer">🗑 Clear all saved chats</button></div>
<div class="settings-actions"><button onclick="resetSettings()">Reset</button><button onclick="closeSettings()">Cancel</button><button class="save" onclick="saveSettings()">Save settings</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let files=[],codeFiles=[],attachments=[],mode='chat',messages=[],sessionId=crypto.randomUUID(),activeController=null;

const defaults={backend:window.location.origin,model:'AI',mode:'chat',theme:'dark',enter:true,save:true,voice:false};
const MAX_VISION_IMAGES=5;
const MAX_VISION_BYTES=2*1024*1024;
let settings={...defaults,...JSON.parse(localStorage.getItem('sais-settings')||'{}')};

function applySettings(){
  $('modelLabel').textContent=settings.model||'AI';
  document.body.dataset.theme=settings.theme;
  if(settings.theme==='light'){
    document.documentElement.style.setProperty('--bg','#e5e5e5');document.documentElement.style.setProperty('--panel','#ffffff');
    document.documentElement.style.setProperty('--panel2','#f0f2f5');document.documentElement.style.setProperty('--line','#d7dbe1');document.documentElement.style.setProperty('--text','#151515');document.documentElement.style.setProperty('--muted','#66707b');
    document.documentElement.style.colorScheme='light';
  }else{
    document.documentElement.style.setProperty('--bg','#151515');document.documentElement.style.setProperty('--panel','#111419');
    document.documentElement.style.setProperty('--panel2','#181c22');document.documentElement.style.setProperty('--line','#2a3038');document.documentElement.style.setProperty('--text','#e5e5e5');document.documentElement.style.setProperty('--muted','#9aa3ad');
    document.documentElement.style.colorScheme='dark';
  }
  const b=[...document.querySelectorAll('.mode')].find(x=>x.dataset.mode===settings.mode);if(b)setMode(b);
  loadHistory();
}
function openSettings(){
  $('sBackend').value=settings.backend;$('sModel').value=settings.model;$('sMode').value=settings.mode;$('sTheme').value=settings.theme;
  $('sEnter').checked=settings.enter;$('sSave').checked=settings.save;$('sVoice').checked=settings.voice;
  $('settingsModal').classList.add('show');
}
function closeSettings(){$('settingsModal').classList.remove('show')}
function saveSettings(){
  settings={backend:$('sBackend').value.trim().replace(/\/$/,''),model:$('sModel').value.trim()||'AI',mode:$('sMode').value,theme:$('sTheme').value,enter:$('sEnter').checked,save:$('sSave').checked,voice:$('sVoice').checked};
  localStorage.setItem('sais-settings',JSON.stringify(settings));applySettings();closeSettings();toast('Settings saved');
}
function resetSettings(){settings={...defaults};localStorage.setItem('sais-settings',JSON.stringify(settings));openSettings();toast('Settings reset')}
function toggleTheme(){settings.theme=settings.theme==='dark'?'light':'dark';localStorage.setItem('sais-settings',JSON.stringify(settings));applySettings()}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}

function toggleMenu(){$('plusMenu').classList.toggle('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.plus')&&!e.target.closest('#plusMenu'))$('plusMenu').classList.remove('show')});
function choose(type){
  $('plusMenu').classList.remove('show');
  const el=type==='folder'?$('folderInput'):$('allInput');
  el.value='';el.click();
}
$('allInput').onchange=e=>addAttachments(e.target.files);
$('folderInput').onchange=e=>addAttachments(e.target.files);

function fileIcon(f){
  const n=(f.name||'').toLowerCase();
  if(f.type?.startsWith('image/')) return '🖼️';
  if(f.type?.startsWith('video/')) return '🎬';
  if(f.type?.startsWith('audio/')) return '🎵';
  if(/\.pdf$/i.test(n)) return '📕';
  if(/\.(docx?|odt)$/i.test(n)) return '📘';
  if(/\.(xlsx?|ods|csv)$/i.test(n)) return '📊';
  if(/\.(pptx?|odp)$/i.test(n)) return '📙';
  if(/\.(zip|rar|7z|tar|gz)$/i.test(n)) return '🗜️';
  if(/\.(html?|css|js|ts|jsx|tsx|py|java|c|cpp|php|sql|json|xml|ya?ml|sh|tex|mathml)$/i.test(n)) return '💻';
  return '📄';
}
function renderAttachments(){
  const bar=$('previewbar');
  if(!bar)return;
  bar.innerHTML='';
  if(!attachments.length){bar.classList.remove('show');return;}
  bar.classList.add('show');
  attachments.forEach((f,i)=>{
    const p=document.createElement('div');p.className='preview';p.title=f.webkitRelativePath||f.name;
    if(f.type?.startsWith('image/')){const im=document.createElement('img');im.src=URL.createObjectURL(f);p.appendChild(im)}
    else if(f.type?.startsWith('video/')){const v=document.createElement('video');v.src=URL.createObjectURL(f);v.muted=true;p.appendChild(v)}
    else{p.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px">'+fileIcon(f)+'</div>'}
    const x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=()=>{attachments.splice(i,1);files=files.filter(q=>q!==f);codeFiles=codeFiles.filter(q=>q.__file!==f);renderAttachments();toggleSend();updateAttachmentHint()};p.appendChild(x);bar.appendChild(p);
  });
}
function clearFiles(){attachments=[];files=[];codeFiles=[];renderAttachments();toggleSend();updateAttachmentHint();$('allInput').value='';$('folderInput').value='';toast('Attachments removed')}

function fileAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function uploadSelectedFiles(list){
  const arr=[...list];
  const out=[];
  for(const f of arr){
    if(f.size>25*1024*1024){toast(`${f.name}: maximum upload size is 25 MB`);continue;}
    try{
      const data=await fileAsDataURL(f);
      const r=await fetch(settings.backend+'/api/files/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:[{name:f.webkitRelativePath||f.name,type:f.type||'application/octet-stream',data}]})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok)throw new Error(d.message||'Upload failed');
      if(Array.isArray(d.files))out.push(...d.files);
    }catch(e){toast(`${f.name}: kept locally (${e.message})`);}
  }
  return out;
}

async function addAttachments(list){
  const incoming=[...list].filter(Boolean);
  if(!incoming.length)return;
  const accepted=[];
  for(const f of incoming){
    if(attachments.length+accepted.length>=40)break;
    if(attachments.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))continue;
    accepted.push(f);
  }
  if(!accepted.length)return;
  attachments.push(...accepted);
  renderAttachments();toggleSend();updateAttachmentHint();

  // Real server upload: files are stored so attachments are not just visual previews.
  const uploaded=await uploadSelectedFiles(accepted);
  uploaded.forEach(u=>{
    const f=accepted.find(x=>(x.webkitRelativePath||x.name)===u.name || x.name===u.name);
    if(f)f.__upload=u;
  });

  for(const f of accepted){
    if(f.type.startsWith('image/')||f.type.startsWith('video/')) files.push(f);
    if(isCodeFile(f.name)){
      try{codeFiles.push({name:f.webkitRelativePath||f.name,content:await f.text(),__file:f});}catch{}
    }
    if(/\.zip$/i.test(f.name) && window.JSZip){
      try{
        const zip=await JSZip.loadAsync(f);
        const entries=Object.values(zip.files).filter(x=>!x.dir).slice(0,120);
        for(const entry of entries){
          const name=entry.name;
          if(/(^|\/)(node_modules|dist|build|\.git)(\/|$)/i.test(name))continue;
          if(isCodeFile(name) || /\.(txt|md|csv|json|xml|ya?ml)$/i.test(name)){
            if(codeFiles.length>=120)break;
            try{codeFiles.push({name,content:await entry.async('string'),__file:f})}catch{}
          }
        }
      }catch(e){toast('ZIP attached, but project scan failed')}
    }
    if(/\.docx$/i.test(f.name) && window.mammoth){
      try{const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});codeFiles.push({name:f.name,content:r.value,__file:f})}catch{}
    }
    if(/\.pdf$/i.test(f.name) && window.pdfjsLib){
      try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let text='';for(let pg=1;pg<=Math.min(pdf.numPages,40);pg++){const page=await pdf.getPage(pg);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}codeFiles.push({name:f.name,content:text,__file:f})}catch{}
    }
    if(/\.(txt|md|csv|json|xml|ya?ml)$/i.test(f.name) && !isCodeFile(f.name)){
      try{codeFiles.push({name:f.name,content:await f.text(),__file:f})}catch{}
    }
  }
  renderAttachments();toggleSend();updateAttachmentHint();
}

function isCodeFile(name){return /\.(html?|css|js|mjs|cjs|ts|tsx|jsx|json|xml|ya?ml|md|txt|py|java|c|cc|cpp|h|hpp|cs|php|sql|sh|bash|mathml|tex)$/i.test(name)}

function setMode(btn){
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  mode=btn.dataset.mode;
  const ph={chat:'Message SUPER AI STUDIO...',studio:'Describe your video, story, scene plan, or edit...',math:'Enter an equation, math problem, or upload a math image...',code:'Paste code, describe an error, or upload a project to debug...'};
  $('prompt').placeholder=ph[mode]||ph.chat;
  $('modeNote').textContent=mode==='studio'?'Video / Script Studio':mode==='math'?'Math • MathML • LaTeX • HTML • SVG':mode==='code'?'Code Doctor • Debug • Fix • Security':'General chat + image understanding';
  toggleSend();
}
function quick(t){$('prompt').value=t;resizePrompt($('prompt'));toggleSend();$('prompt').focus()}
function resizePrompt(t){
  t.style.height='auto';
  const h=Math.min(t.scrollHeight,190);
  t.style.height=h+'px';
  const wrap=document.querySelector('.composer-wrap');
  if(wrap)requestAnimationFrame(()=>{$('chat').style.paddingBottom=(wrap.offsetHeight+20)+'px'});
}
function toggleSend(){$('send').disabled=!$('prompt').value.trim()&&!attachments.length}
function setGenerating(on){
  const b=$('send');
  if(on){b.classList.add('stop');b.textContent='■';b.disabled=false;b.title='Stop generating';}
  else{b.classList.remove('stop');b.textContent='↑';b.title='Send';toggleSend();}
}
function handleSendClick(){
  if(activeController){activeController.abort();return}
  send();
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey&&settings.enter){e.preventDefault();handleSendClick()}}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

// Never expose model chain-of-thought, hidden reasoning, tool calls, or internal tags.
function cleanAIResponse(text){
  if(!text)return '';
  let out=String(text);
  const blocks=['think','thinking','analysis','reasoning','reflection','tool_call','tool','function','internal'];
  for(const tag of blocks){
    const re=new RegExp('<'+tag+'\\b[^>]*>[\\s\\S]*?<\\/'+tag+'>','gi');
    out=out.replace(re,'');
    // Hide an unfinished hidden block while the stream is still arriving.
    const openRe=new RegExp('<'+tag+'\\b[^>]*>[\\s\\S]*$','i');
    out=out.replace(openRe,'');
  }
  out=out.replace(/<\|[^>]+\|>/g,'');
  return out.trim();
}

function addMessage(role,text,attached=[]){
  $('empty')?.remove();const m=document.createElement('div');m.className='msg '+(role==='user'?'user':'');
  m.innerHTML='<div class="avatar">'+(role==='user'?'U':'✦')+'</div><div class="bubble">'+escapeHTML(text).replace(/\n/g,'<br>')+'</div>';
  if(attached.length){const wrap=document.createElement('div');wrap.className='attachments';attached.forEach(f=>{
    const a=document.createElement('div');a.className='att';
    if(f.type.startsWith('image/')||f.type.startsWith('video/')){const u=URL.createObjectURL(f);const med=f.type.startsWith('image/')?document.createElement('img'):document.createElement('video');med.src=u;if(med.tagName==='VIDEO'){med.controls=true;med.muted=true}a.appendChild(med)}
    else{a.innerHTML='<div style="height:95px;display:flex;align-items:center;justify-content:center;font-size:34px">'+fileIcon(f)+'</div>'}
    const n=document.createElement('div');n.className='attname';n.textContent=f.webkitRelativePath||f.name;a.appendChild(n);wrap.appendChild(a);
  });m.querySelector('.bubble').appendChild(wrap)}
  if(role==='assistant' && text){
    const actions=document.createElement('div');actions.className='message-actions';
    const b=document.createElement('button');b.className='download';b.textContent='⬇ Download';b.onclick=()=>toggleDownloadMenu(actions,text);actions.appendChild(b);
    const menu=document.createElement('div');menu.className='download-menu';menu.innerHTML=`<button data-f="txt">📄 Text (.txt)</button><button data-f="md">📝 Markdown (.md)</button><button data-f="html">🌐 HTML (.html)</button><button data-f="word">📘 Word (.doc)</button><button data-f="pdf">📕 PDF (.pdf)</button><button data-f="image">🖼️ Image (.png)</button><button data-f="json">🔢 JSON (.json)</button><button data-f="csv">📊 CSV (.csv)</button><button data-f="rtf">📚 RTF (.rtf)</button><button data-f="zip">🗜️ All formats (.zip)</button>`;
    menu.querySelectorAll('button').forEach(x=>x.onclick=()=>{downloadAnswer(text,x.dataset.f);menu.classList.remove('show')});actions.appendChild(menu);m.querySelector('.bubble').appendChild(actions);
  }
  $('messages').appendChild(m);$('chat').scrollTop=999999;return m
}
function toggleDownloadMenu(actions,text){document.querySelectorAll('.download-menu.show').forEach(x=>x.classList.remove('show'));actions.querySelector('.download-menu').classList.toggle('show')}
function slug(s){return (s||'SUPER-AI-STUDIO-answer').replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,60)||'SUPER-AI-STUDIO-answer'}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function downloadAnswer(text,format){
  const base=slug(text.split('\n').find(x=>x.trim())||'SUPER-AI-STUDIO-answer');
  if(format==='txt')return saveBlob(new Blob([text],{type:'text/plain;charset=utf-8'}),base+'.txt');
  if(format==='md')return saveBlob(new Blob([text],{type:'text/markdown;charset=utf-8'}),base+'.md');
  if(format==='json')return saveBlob(new Blob([JSON.stringify({answer:text,created:new Date().toISOString()},null,2)],{type:'application/json'}),base+'.json');
  const html='<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHTML(base)+'</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;line-height:1.6;padding:20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:14px;border-radius:8px}</style></head><body><h1>SUPER AI STUDIO</h1><pre>'+escapeHTML(text)+'</pre></body></html>';
  if(format==='html')return saveBlob(new Blob([html],{type:'text/html;charset=utf-8'}),base+'.html');
  if(format==='word')return saveBlob(new Blob(['\ufeff',html],{type:'application/msword'}),base+'.doc');
  if(format==='csv')return saveBlob(new Blob(['\ufeffanswer\n'+JSON.stringify(text)],{type:'text/csv;charset=utf-8'}),base+'.csv');
  if(format==='rtf'){const rtf='{\\rtf1\\ansi\\deff0 '+text.replace(/\\/g,'\\\\').replace(/[{}]/g,'\\$&').replace(/\n/g,'\\par ' )+'}';return saveBlob(new Blob([rtf],{type:'application/rtf'}),base+'.rtf')}
  if(format==='pdf'){
    if(window.jspdf?.jsPDF){const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});const lines=doc.splitTextToSize(text,520);let y=50;doc.setFont('helvetica','normal');doc.setFontSize(11);for(const line of lines){if(y>800){doc.addPage();y=50}doc.text(line,40,y);y+=16}doc.save(base+'.pdf');return}
    const w=window.open('', '_blank');if(w){w.document.write(html+'<script>window.onload=()=>window.print()<\/script>');w.document.close()}return toast('PDF generator unavailable; use Print > Save as PDF')}
  if(format==='zip'){const z=new JSZip();z.file(base+'.txt',text);z.file(base+'.md',text);z.file(base+'.html',html);z.file(base+'.doc',html);z.file(base+'.json',JSON.stringify({answer:text,created:new Date().toISOString()},null,2));return z.generateAsync({type:'blob'}).then(b=>saveBlob(b,base+'.zip'))}
  if(format==='image'){const c=document.createElement('canvas'),ctx=c.getContext('2d');const lines=text.split('\n');const w=1400,pad=60,line=30;c.width=w;c.height=Math.max(180,pad*2+lines.length*line+50);ctx.fillStyle='#151515';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='20px Arial';let y=pad+25;for(const l of lines){let words=l.split(' '),cur='';for(const word of words){const test=cur?cur+' '+word:word;if(ctx.measureText(test).width>w-pad*2){ctx.fillText(cur,pad,y);y+=line;cur=word}else cur=test}ctx.fillText(cur,pad,y);y+=line}c.toBlob(b=>saveBlob(b,base+'.png'),'image/png');}
}

function addTyping(){const m=document.createElement('div');m.className='msg';m.id='typing';m.innerHTML='<div class="avatar">✦</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';$('messages').appendChild(m);$('chat').scrollTop=999999}
function removeTyping(){$('typing')?.remove()}

async function fileToVisionDataURL(file){
  if(!file.type.startsWith('image/'))return null;
  const raw=await file.arrayBuffer();
  if(raw.byteLength<=MAX_VISION_BYTES){
    let binary='';const bytes=new Uint8Array(raw);const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
    return `data:${file.type};base64,${btoa(binary)}`;
  }
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url});
    const max=2048,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.82);
  }finally{URL.revokeObjectURL(url)}
}
async function prepareVisionImages(attached){
  const images=attached.filter(f=>f.type.startsWith('image/')).slice(0,MAX_VISION_IMAGES);
  const out=[];
  for(const f of images){
    try{out.push({name:f.name,type:'image',data:await fileToVisionDataURL(f)})}catch{}
  }
  return out.filter(x=>x.data);
}
function updateAttachmentHint(){
  const note=$('modeNote');
  if(!note)return;
  const count=files.filter(f=>f.type.startsWith('image/')).length;
  note.textContent=count?(mode==='studio'?`Studio • ${count} image${count>1?'s':''}`:mode==='math'?`Math Vision • ${count} image${count>1?'s':''}`:`Vision • ${count} image${count>1?'s':''}`):codeFiles.length&&mode==='code'?`Code Doctor • ${codeFiles.length} file${codeFiles.length>1?'s':''}`:(mode==='studio'?'Video / Script Studio':mode==='math'?'Math • MathML • LaTeX • HTML • SVG':mode==='code'?'Code Doctor • Debug • Fix • Security':'General chat + image understanding');
}

async function send(){
  const text=$('prompt').value.trim();if(!text&&!attachments.length)return;
  const sentFiles=[...attachments];
  const visionImages=await prepareVisionImages(sentFiles);
  const sentCode=[...codeFiles];
  const uploadedFiles=sentFiles.map(f=>f.__upload).filter(Boolean);
  addMessage('user',text||'Code project attached',sentFiles);
  if(codeFiles.length){const names=codeFiles.slice(0,20).map(x=>x.name).join(', ');addMessage('user','🧑‍💻 Code files: '+names+(codeFiles.length>20?' …':''));}
  messages.push({role:'user',content:text,mode,files:sentFiles.map(f=>f.webkitRelativePath||f.name),codeFiles:sentCode.map(f=>f.name)});
  $('prompt').value='';resizePrompt($('prompt'));files=[];codeFiles=[];attachments=[];renderAttachments();toggleSend();updateAttachmentHint();saveCurrent();addTyping();
  activeController=new AbortController();const controller=activeController;setGenerating(true);

  let full='';
  try{
    const r=await fetch(settings.backend+'/api/ai/chat/stream',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,mode,history:messages.slice(-10),images:visionImages,codeFiles:sentCode,attachments:uploadedFiles}),
      signal:controller.signal
    });
    if(!r.ok||!r.body){const d=await r.json().catch(()=>({}));throw new Error(d.message||'AI request failed')}
    removeTyping();
    const bubbleEl=addMessage('assistant','');const bubble=bubbleEl.querySelector('.bubble');
    const reader=r.body.getReader();const decoder=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop();
      for(const part of parts){
        const line=part.trim();if(!line.startsWith('data:'))continue;
        let payload;try{payload=JSON.parse(line.slice(5).trim())}catch{continue}
        if(payload.error)throw new Error(payload.error);
        if(payload.token){full+=payload.token;const visible=cleanAIResponse(full);bubble.innerHTML=escapeHTML(visible).replace(/\n/g,'<br>');$('chat').scrollTop=999999}
      }
    }
    const finalAnswer=cleanAIResponse(full);
    if(!finalAnswer)bubble.textContent="I couldn't generate a response.";
    else bubble.innerHTML=escapeHTML(finalAnswer).replace(/\n/g,'<br>');
    messages.push({role:'assistant',content:finalAnswer});saveCurrent();
  }catch(e){
    removeTyping();
    if(e.name==='AbortError'){const stopped=cleanAIResponse(full);if(stopped.trim())messages.push({role:'assistant',content:stopped});else addMessage('assistant','⏹ Stopped.');saveCurrent()}
    else addMessage('assistant','❌ '+e.message);
  }finally{
    activeController=null;setGenerating(false);
  }
}

function newChat(){sessionId=crypto.randomUUID();messages=[];$('messages').innerHTML='<div class="empty" id="empty"><h1>Ready when you are.</h1></div>';files=[];codeFiles=[];attachments=[];renderAttachments();toggleSend();toast('New chat')}
function saveCurrent(){if(!settings.save||!messages.length)return;const all=JSON.parse(localStorage.getItem('sais-chats')||'[]');const item={id:sessionId,title:messages.find(x=>x.role==='user')?.content?.slice(0,45)||'New chat',messages,updated:Date.now()};const idx=all.findIndex(x=>x.id===sessionId);if(idx>=0)all[idx]=item;else all.unshift(item);localStorage.setItem('sais-chats',JSON.stringify(all.slice(0,40)));loadHistory()}
function loadHistory(){const h=$('history');h.innerHTML='';const all=JSON.parse(localStorage.getItem('sais-chats')||'[]');all.forEach(x=>{const d=document.createElement('div');d.className='chatrow '+(x.id===sessionId?'active':'');d.innerHTML='<span class="dot"></span><span class="title">'+escapeHTML(x.title)+'</span><button class="del" title="Delete chat">✕</button>';d.onclick=()=>restoreChat(x);d.querySelector('.del').onclick=(e)=>{e.stopPropagation();deleteChat(x.id)};h.appendChild(d)})}
function deleteChat(id){
  if(!confirm('Delete this chat?'))return;
  const all=JSON.parse(localStorage.getItem('sais-chats')||'[]').filter(x=>x.id!==id);
  localStorage.setItem('sais-chats',JSON.stringify(all));
  if(id===sessionId)newChat();
  loadHistory();toast('Chat deleted');
}
function restoreChat(x){sessionId=x.id;messages=x.messages||[];$('messages').innerHTML='';messages.forEach(m=>{if(m.role==='user'||m.role==='assistant')addMessage(m.role,m.content||'')});loadHistory()}
function clearHistory(){if(confirm('Clear saved chat history?')){localStorage.removeItem('sais-chats');loadHistory();toast('History cleared')}}
function setupDrop(){
  const c=$('composer');['dragenter','dragover'].forEach(ev=>c.addEventListener(ev,e=>{e.preventDefault();$('dropzone').classList.add('show')}));
  ['dragleave','drop'].forEach(ev=>c.addEventListener(ev,e=>{e.preventDefault();$('dropzone').classList.remove('show')}));
  c.addEventListener('drop',e=>addAttachments(e.dataTransfer.files));
}
setupDrop();applySettings();renderAttachments();toggleSend();resizePrompt($('prompt'));updateAttachmentHint();
</script>
